{% set name = "seastats" %}
{% set version = "0.2.2" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/seastats-{{ version }}.tar.gz
  sha256: 611078a3797f835afbf6eea8671170864da8110f5ee53dcdc0ee59a91a9d6425

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
  run:
    - python >={{ python_min }}
    - deprecated
    - numpy
    - pandas
    - pyextremes
    - deprecated

test:
  imports:
    - seastats
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/oceanmodeling/seastats
  summary: package for metocean statistics
  license: EUPL-1.2
  license_file: LICENSE

extra:
  recipe-maintainers:
    - brey
    - pmav99
    - tomsail
